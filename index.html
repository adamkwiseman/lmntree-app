<!DOCTYPE html>

<!--

  ============================================================

  LMN TREE — FULL SHELL (Step 4: reads content from Supabase)

  ============================================================

  Units, lessons, and cards now come LIVE from your database.

  Tap a unit  -> loads its lessons from `lessons`

  Tap a tile  -> loads that lesson (art + video from `lessons`)

  Listen&Speak-> loads that lesson's cards from `cards`

  Finish      -> writes progress (lesson_id = the lesson's DB id)



  Positions (PICKER/GRID/HUB/CARD/UCTRL) are still hardcoded —

  that's your calibration, unchanged. Only content is now from DB.



  Add a lesson in Supabase -> it appears here. No code edits.

  ============================================================

-->

<style>

<body>

  <button id="calBtn" onclick="toggleCal()" hidden>Calibrate</button>

  <div class="screen artfull" id="pickerScreen">

    <div class="stage" id="pickerStage">

      <div id="loginPanel" class="hidden">

        <div id="loginForm">

          <h3>Log in</h3><p class="hint">Try Ahmed / 1234</p>

          <input id="nameInput" type="text" placeholder="Your name" />

          <input id="pinInput" type="text" placeholder="PIN" />

          <button class="go" onclick="doLogin()">Enter</button>

      </div>

    </div>

  </div>

  <div class="screen artfull hidden" id="unitScreen"><div class="stage" id="unitStage"></div></div>

  <div class="screen artfull hidden" id="hubScreen"><div class="stage" id="hubStage"></div></div>

  <div class="screen artfull hidden" id="slidesScreen"><div class="stage" id="slidesStage"></div></div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="layout.js"></script>

<script>

function createPracticePlayer(root,options){



'use strict';

const $=id=>root.querySelector('[data-player="'+id+'"]'), buttons=['listen','record','compare'];

let ctx,model,user,userBlob,stream,recorder,analyser,micSource,raf,timer,sources=[],phase='loading',heard=false,token=0,text='',modelPeaks=[],userPeaks=[],cancelTake=false,playbackKind=null;

const say=s=>$('status').textContent=s;

function audioContext(){return ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());}

function ui(next,message){phase=next;if(message!==undefined)say(message);buttons.forEach(id=>{$(id).classList.remove('pulse','active');$(id).disabled=false;});$('listen').disabled=!model||['permission','countdown','recording','saving','loading','checking'].includes(phase);$('record').disabled=!model||['permission','saving','loading','checking'].includes(phase);$('compare').disabled=!user||!['ready','review','playing'].includes(phase);if(phase==='ready')$(heard?'record':'listen').classList.add('pulse');if(phase==='review'){ $('compare').classList.add('pulse');}if(phase==='recording')$('record').classList.add('active');$('record').setAttribute('aria-label',phase==='recording'?'Stop recording':phase==='countdown'?'Cancel countdown':'Record your voice');syncStopControls();}

function syncStopControls(){

  const ids=phase==='playing'?(playbackKind==='both'?['listen','record','compare']:playbackKind==='model'?['listen']:playbackKind==='user'?['record']:[]):phase==='recording'?['record']:[];

  const labels={listen:'Listen to the model',compare:'Play both and check',record:phase==='countdown'?'Cancel countdown':'Record your voice'};

  for(const id of buttons){const active=ids.includes(id),b=$(id);b.classList.toggle('stop-face',active);const label=active?(phase==='recording'?'Stop recording':playbackKind==='both'?'Stop both recordings':'Stop playback'):labels[id];b.setAttribute('aria-label',label);b.title=label;}

}

function togglePlayback(kind){

  const id=kind==='model'?'listen':kind==='user'?'record':'compare';

  if(phase==='playing'&&$(id).classList.contains('stop-face')){

    ++token;stopPlayback();ui(user?'review':'ready','');return;

  }

  return play(kind);

}

function peaks(buffer,n=110){const d=buffer.getChannelData(0),p=[];for(let i=0;i<n;i++){let sum=0;const a=Math.floor(i*d.length/n),b=Math.floor((i+1)*d.length/n);for(let j=a;j<b;j++)sum+=d[j]*d[j];p.push(Math.sqrt(sum/Math.max(1,b-a)));}const max=Math.max(.001,...p);return p.map(v=>v/max);}

function draw(id,p,color,progress=0){const c=$(id),r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=Math.max(1,r.width*ratio);c.height=Math.max(1,r.height*ratio);const g=c.getContext('2d'),w=c.width,h=c.height;g.strokeStyle=color;g.lineWidth=ratio;g.globalAlpha=.45;g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();g.globalAlpha=1;const step=w/Math.max(1,p.length);p.forEach((v,i)=>{g.fillStyle=color;g.globalAlpha=progress&&i/p.length<progress?1:.65;const bh=Math.max(2*ratio,v*h*.88);g.fillRect(i*step,h/2-bh/2,Math.max(ratio,step*.55),bh);});if(progress){g.globalAlpha=1;g.fillStyle='#263b54';g.fillRect(w*progress,0,2*ratio,h);}}

function redraw(){draw('modelWave',modelPeaks,'#168d55');draw('userWave',userPeaks,'#dd3444');}

const observer=new ResizeObserver(redraw);observer.observe(root);

function stopPlayback(){playbackKind=null;syncStopControls();sources.forEach(s=>{s.onended=null;try{s.stop();}catch{}});sources=[];cancelAnimationFrame(raf);redraw();}

function trim(buffer){const d=buffer.getChannelData(0),block=256;let peak=0;for(let i=0;i<d.length;i++)peak=Math.max(peak,Math.abs(d[i]));const threshold=Math.max(.006,peak*.07);let first=0,last=d.length;for(let i=0;i<d.length;i+=block){let sum=0;for(let j=i;j<Math.min(d.length,i+block);j++)sum+=d[j]*d[j];if(Math.sqrt(sum/block)>threshold){first=Math.max(0,i-Math.floor(buffer.sampleRate*.07));break;}}for(let i=d.length-block;i>first;i-=block){let sum=0;for(let j=i;j<i+block;j++)sum+=d[j]*d[j];if(Math.sqrt(sum/block)>threshold){last=Math.min(d.length,i+block+Math.floor(buffer.sampleRate*.15));break;}}const out=audioContext().createBuffer(buffer.numberOfChannels,Math.max(1,last-first),buffer.sampleRate);for(let ch=0;ch<buffer.numberOfChannels;ch++)out.copyToChannel(buffer.getChannelData(ch).subarray(first,last),ch);return out;}

async function play(kind){options.onAction?.();const mine=++token;stopPlayback();try{await audioContext().resume();if(mine!==token)return;const list=kind==='model'?[model]:kind==='user'?[user]:[model,user];if(list.some(x=>!x))return;playbackKind=kind;ui('playing',kind==='model'?'Listen to the model…':kind==='user'?'Listen to your voice…':'Listen to both voices…');const start=ctx.currentTime+.06,duration=Math.max(...list.map(b=>b.duration));let pending=list.length;for(const b of list){const s=ctx.createBufferSource(),gain=ctx.createGain();s.buffer=b;gain.gain.value=list.length===2?.5:1;s.connect(gain).connect(ctx.destination);s.onended=()=>{gain.disconnect();if(--pending===0&&mine===token){sources=[];cancelAnimationFrame(raf);redraw();if(kind==='model'){heard=true;ui('ready','Your turn! Press the microphone.');}else if(kind==='both')check(mine);else ui('review','Press the green/red button to compare.');}};sources.push(s);s.start(start);}function tick(){const t=Math.max(0,ctx.currentTime-start);draw('modelWave',modelPeaks,'#168d55',kind==='user'?0:Math.min(1,t/model.duration));draw('userWave',userPeaks,'#dd3444',kind==='model'?0:Math.min(1,t/user.duration));if(t<duration)raf=requestAnimationFrame(tick);}tick();}catch(e){if(mine===token)ui(user?'review':'ready','Playback unavailable. Please try again.');}}

function closeMic(){clearInterval(timer);cancelAnimationFrame(raf);if(micSource)micSource.disconnect();micSource=null;analyser=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('count').hidden=true;}

async function record(){if(phase==='playing'&&$('record').classList.contains('stop-face')){++token;stopPlayback();ui('review','Press the green/red button to compare.');return;}if(phase==='countdown'){token++;closeMic();ui('ready','Press the microphone when you are ready.');return;}if(phase==='recording'){finish();return;}options.onAction?.();const mine=++token;stopPlayback();ui('permission','Allow microphone access to begin.');try{await audioContext().resume();if(mine!==token)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('unsupported');const incoming=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(mine!==token){incoming.getTracks().forEach(t=>t.stop());return;}stream=incoming;ui('countdown','Get ready…');let n=3;$('count').hidden=false;$('count').textContent=n;timer=setInterval(()=>{n--;if(n){$('count').textContent=n;}else{clearInterval(timer);$('count').hidden=true;capture(mine);}},500);}catch(e){if(mine!==token)return;closeMic();ui('ready',e.name==='NotAllowedError'?'Please allow microphone access, then try again.':e.name==='NotFoundError'?'No microphone found. Connect one and try again.':'Microphone unavailable. Open this in Chrome or Edge, or on an HTTPS page.');}}

// Local practice score: broad amplitude pattern, duration and average energy.

// This is NOT phoneme, word, pitch or pronunciation recognition.

function audioEnvelope(buffer,n=20){

  if(!buffer||!Number.isFinite(buffer.duration)||buffer.duration<=0)throw Error('Missing audio');

  const d=buffer.getChannelData(0),values=[];

  if(d.length<n)throw Error('Audio too short');

  for(let i=0;i<n;i++){

    const a=Math.floor(i*d.length/n),b=Math.floor((i+1)*d.length/n);let sum=0;

    for(let j=a;j<b;j++)sum+=d[j]*d[j];

    values.push(Math.sqrt(sum/Math.max(1,b-a)));

  }

  return values;

}

function localSimilarity(reference,recording){

  const a=audioEnvelope(reference),b=audioEnvelope(recording);

  const mean=v=>v.reduce((sum,x)=>sum+x,0)/v.length;

  const ea=mean(a),eb=mean(b);

  if(ea<0.001||eb<0.001)throw Error('No usable sound');

  let dot=0,aa=0,bb=0;

  for(let i=0;i<a.length;i++){dot+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i];}

  const rhythmRaw=100*dot/Math.sqrt(aa*bb);

  const timingRaw=100*(1-Math.abs(1-recording.duration/reference.duration));

  const energyRaw=100*Math.min(ea,eb)/Math.max(ea,eb);

  // Preserve the original forgiving curve and weights, using REAL reference audio.

  const lift=v=>Math.round(45+55*Math.pow(Math.max(0,Math.min(100,v))/100,0.6));

  const rhythm=lift(rhythmRaw),timing=lift(timingRaw),energy=lift(energyRaw);

  return {score:Math.round(rhythm*.25+timing*.40+energy*.35),rhythm,timing,energy};

}

n value="sr">Serbian</option><option value="st">Sesotho</option><option value="crs">Seychellois Creole</option><option value="shn">Shan</option><option value="sn">Shona</option><option value="scn">Sicilian</option><option value="szl">Silesian</option><option value="sd">Sindhi</option><option value="si">Sinhala (Sinhalese)</option><option value="sk">Slovak</option><option value="sl">Slovenian</option><option value="so">Somali</option><option value="es">Spanish</option><option value="su">Sundanese</option><option value="sw">Swahili</option><option value="ss">Swati</option><option value="sv">Swedish</option><option value="tg">Tajik</option><option value="ta">Tamil</option><option value="tt">Tatar</option><option value="te">Telugu</option><option value="tet">Tetum</option><option value="th">Thai</option><option value="ti">Tigrinya</option><option value="ts">Tsonga</option><option value="tn">Tswana</option><option value="tr">Turkish</option><option value="tk">Turkmen</option><option value="ak">Twi (Akan)</option><option value="uk">Ukrainian</option><option value="ur">Urdu</option><option value="ug">Uyghur</option><option value="uz">Uzbek</option><option value="vi">Vietnamese</option><option value="cy">Welsh</option><option value="xh">Xhosa</option><option value="yi">Yiddish</option><option value="yo">Yoruba</option><option value="yua">Yucatec Maya</option><option value="zu">Zulu</option></optgroup>';

    let sIdx=0, curAudio=null, xlateShown=false, translationRequest=0;

    async function openSlides(){

      const { data, error } = LMN_PREVIEW ? {data:previewCards,error:null} : await db.from("cards").select("*").eq("lesson_id",currentLesson.id).order("card_order");

      if(error){ console.error("cards load:",error); toast("Couldn't load cards (see console)"); return; }

      if(!data || !data.length){ toast("No cards yet for this lesson"); return; }

      currentCards=data; sIdx=0; buildSlides(); showCard("slidesScreen");

    }

    function curS(){ return currentCards[sIdx]; }

    function buildSlides(){

      practicePlayer?.destroy();practicePlayer=null;

      let h="";

      h+='<div id="phraseBand" aria-hidden="true"></div>';

      h+='<div class="ovl" id="phraseBox" style="'+pxs(CARD.phrase)+'"></div>';

      h+='<div class="ovl" id="transPanel" style="'+pxs(CARD.trans)+'"><div class="en" id="enPhrase"></div><select id="langSel" aria-label="Translation language" onchange="doTranslate()">'+LANGS+'</select><div class="trow"><div class="out" id="transOut"></div><button class="listen" id="listenBtn" style="display:none" onclick="doListen()">\uD83D\uDD0A Listen</button></div></div>';

      h+='<button id="xlateBtn" data-n="'+CARD.xlate.n+'" style="left:'+CARD.xlate.left+'%; top:'+CARD.xlate.top+'%; width:'+CARD.xlate.width+'%;" aria-label="Translate" title="Translate" onclick="toggleTranslate()"><svg viewBox="249 353 117 116" aria-hidden="true" focusable="false" style="display:block;width:100%;height:100%"><defs><clipPath id="translationGlobeClip"><circle cx="306.5" cy="408.5" r="52.5"/><path d="M278 437 L269 460 Q269 465 276 462 L302 452 Z"/></clipPath></defs><image href="study-card-original.png" x="0" y="0" width="1672" height="941" clip-path="url(#translationGlobeClip)"/></svg></button>';

      h+='<div class="ovl" id="phoneMedia" style="'+pxs(CARD.phone)+'"></div>';

      h+='<button class="zone nav" data-n="'+CARD.prev.n+'" style="'+pxs(CARD.prev)+'" onclick="prevSlide()">‹</button>';

      h+='<button class="zone nav" data-n="'+CARD.next.n+'" style="'+pxs(CARD.next)+'" onclick="nextSlide()">›</button>';

      h+='<section id="practicePlayer" aria-label="Listen, record and compare"><button type="button" class="lp-button lp-listen" data-player="listen" aria-label="Listen" title="Listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><button type="button" class="lp-button lp-record" data-player="record" aria-label="Record your voice" title="Record your voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 6 6.93V21H8v2h8v-2h-3v-2.07A7 7 0 0 0 19 12v-2h-2v2a5 5 0 0 1-10 0v-2z"/></svg></button><button type="button" class="lp-button lp-compare" data-player="compare" aria-label="Play both and check" title="Play both and check"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M3 5v14l10-7zM19 5v14l10-7z"/></svg></button><canvas class="lp-wave lp-model" data-player="modelWave" aria-label="Model waveform"></canvas><canvas class="lp-wave lp-user" data-player="userWave" aria-label="Your waveform"></canvas><div class="lp-count" data-player="count" hidden></div><div class="lp-status" data-player="status" role="status" aria-live="polite"></div></section>';

      h+='<button class="zone" data-n="'+CARD.back.n+'" style="'+pxs(CARD.back)+'" onclick="showCard(\'hubScreen\')"></button>';

      ['lesson'].forEach(function(k){ const b=CARDNAV[k]; h+='<button class="cardnav" data-n="'+b.n+'" style="left:'+b.left+'%; top:'+b.top+'%; width:'+b.width+'%; background:#102b4b;color:white;font:700 1vw system-ui;border-radius:8px;" onclick="buildHub();showCard(\'hubScreen\')">Lesson</button>'; });

      document.getElementById("slidesStage").innerHTML=h;

      practicePlayer=createPracticePlayer(document.getElementById("practicePlayer"),{onAction:stopOtherAudio,makeVoice:makeModelVoice});

      showSlide();

      LMNLayout.apply(LMNLayout.load());

    }

    function showSlide(){

      stopOtherAudio();slideRevision++;

      const s=curS();

      renderClickablePhrase(document.getElementById("phraseBox"), s.phrase);

      document.getElementById("enPhrase").textContent="EN: "+s.phrase;

      const tp=document.getElementById("transPanel"), xb=document.getElementById("xlateBtn");

      xlateShown=false; tp.style.display="none";

      const languageSelect=document.getElementById("langSel");

      languageSelect.style.display=""; languageSelect.value=currentLang||"";

      document.getElementById("transOut").textContent="";

      document.getElementById("listenBtn").style.display="none";

      if(xb) xb.style.display = s.skip_translate ? "none" : "";

      if(!s.skip_translate && currentLang){tp.style.display="flex";xlateShown=true;doTranslate();}

      const audioUrl=firstAudioUrl(s);

      practicePlayer.setLesson({text:s.phrase,audioUrl});

      const media=s.phone_media_url, pm=document.getElementById("phoneMedia");

      const mt=(s.phone_media_type||"").toLowerCase().trim();

      const isVideo = !!media && ( mt.indexOf("video")>-1 || ( mt!=="image" && mt!=="img" && /\.(mp4|m4v|mov|webm|ogv)(\?|#|$)/i.test(media) ) );

      pm.innerHTML = media ? (isVideo ? '<video id="cardVideo" src="'+media+'" playsinline webkit-playsinline preload="metadata"></video>' : '<img src="'+media+'" alt="">') : "media";

      const oldBtn=document.getElementById("playToggle"); if(oldBtn) oldBtn.remove();

      if(isVideo){

        const b=document.createElement("button");

        b.id="playToggle"; b.setAttribute("style",pxs(CARD.playbtn));

        b.innerHTML=PLAY_ICON;

        b.onclick=togglePlay;

        document.getElementById("slidesStage").appendChild(b);

        const v=document.getElementById("cardVideo");

        v.onplay=function(){ stopOtherAudio(v);practicePlayer?.pause(); b.innerHTML=PAUSE_ICON; };

        v.onpause=function(){ b.innerHTML=PLAY_ICON; };

        v.onended=function(){ b.innerHTML=PLAY_ICON; };

        v.play().catch(function(){});   // autoplay on card open; if the browser blocks it, the play button remains

      }

    }

    function prevSlide(){ if(sIdx>0){ sIdx--; } else { sIdx=currentCards.length-1; } showSlide(); }

    function nextSlide(){

      if(sIdx<currentCards.length-1){ sIdx++; showSlide(); }

      else { markLessonComplete(); showCard("hubScreen"); buildHub(); }

    }

    async function markLessonComplete(){

      if(!currentLesson)return;

      setActivity('speak');

      await saveLessonCompletion();

    }

function toggleTranslate(){

      const tp=document.getElementById("transPanel"), sel=document.getElementById("langSel"), out=document.getElementById("transOut"), lb=document.getElementById("listenBtn");

      if(xlateShown){ tp.style.display="none"; xlateShown=false; return; }

      if(curS().skip_translate)return;

      tp.style.display="flex"; xlateShown=true; sel.style.display="";

      if(!currentLang){ sel.style.display=""; sel.value=""; out.textContent="\uD83D\uDC47 Pick your language"; lb.style.display="none"; }

      else { sel.value=currentLang; doTranslate(); }

    }

      async function doTranslate(){

      const lang=document.getElementById("langSel").value, out=document.getElementById("transOut"), lb=document.getElementById("listenBtn");

      const request=++translationRequest;

      stopOtherAudio();

      currentLang=lang; try{ localStorage.setItem("lmnLang",lang); }catch(e){} document.getElementById("langSel").style.display="";

      if(!lang){ out.textContent=""; lb.style.display="none"; return; }

      const forIdx=slideRevision;

      out.textContent="Translating\u2026"; lb.style.display="none";

      try{ const r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"translate",text:curS().phrase,lang:lang})}); const d=await r.json(); if(request!==translationRequest||forIdx!==slideRevision||lang!==currentLang) return; if(d.translation){ out.textContent=d.translation; lb.style.display="inline-block"; } else out.textContent="No translation."; }catch(e){ if(request===translationRequest&&forIdx===slideRevision&&lang===currentLang) out.textContent="Translation unavailable."; }

    }

    async function doListen(){

      const lang=document.getElementById('langSel').value,text=document.getElementById('transOut').textContent;

      if(!lang||!text)return;

      if(curAudio&&!curAudio.paused){stopOtherAudio();return;}

      stopOtherAudio();practicePlayer?.pause();const request=mediaRequest,revision=slideRevision;

      try{

        const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'speak',text,lang})});

        if(!r.ok)throw Error('Speech unavailable');const d=await r.json();

        if(request!==mediaRequest||revision!==slideRevision||lang!==currentLang)return;

        if(d.audio){curAudio=new Audio('data:audio/mp3;base64,'+d.audio);await curAudio.play();}

      }catch(e){if(request===mediaRequest)toast('Translation audio unavailable.');}

    }

    function speakWord(w){

      stopOtherAudio();practicePlayer?.pause();

      try{ if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=0.9; window.speechSynthesis.speak(u); }catch(e){}

    }

    function renderClickablePhrase(el, phrase){

      el.innerHTML="";

      const wrap=document.createElement("span"); wrap.className="wp";

      String(phrase).split(/(\s+)/).forEach(function(tok){

        if(tok==="") return;

        if(/^\s+$/.test(tok)){ wrap.appendChild(document.createTextNode(tok)); return; }

        const clean=tok.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,"");

        const sp=document.createElement("span"); sp.className="wtap"; sp.textContent=tok;

        sp.onclick=function(){ speakWord(clean||tok); };

        wrap.appendChild(sp);

      });

      el.appendChild(wrap);

    }

      const PLAY_ICON='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

      const PAUSE_ICON='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

     function togglePlay(){ const v=document.getElementById("cardVideo"); if(!v) return; if(v.paused) v.play(); else v.pause(); }

    function firstAudioUrl(row){

      for(const name of ['model_audio_url','audio_url','model_audio','tts_audio_url','tts_url','audio']){

        if(typeof row[name]==='string'&&row[name].trim())return row[name].trim();

      }

      return '';

    }

    async function makeModelVoice(phrase,signal){

      if(voiceCache.has(phrase))return voiceCache.get(phrase);

      const r=await fetch(FUNCTION_URL,{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'speak',text:phrase,lang:'en'})});

      if(!r.ok)throw Error('Model speech unavailable');const d=await r.json();

      if(!d.audio)throw Error('No model audio');const url='data:audio/mp3;base64,'+d.audio;

      voiceCache.set(phrase,url);return url;

    }

    function stopOtherAudio(exceptVideo){

      mediaRequest++;

      if(curAudio){curAudio.pause();curAudio=null;}

      window.speechSynthesis?.cancel();

      document.querySelectorAll('video').forEach(v=>{if(v!==exceptVideo)v.pause();});

    }

    window.addEventListener('pagehide',()=>{stopOtherAudio();practicePlayer?.destroy();practicePlayer=null;});



    /* ===== LOGIN + PROGRESS ===== */

    async function doLogin(){

      if(!db){ document.getElementById("loginStatus").textContent="Supabase not configured."; return; }

      const name=document.getElementById("nameInput").value.trim(), pin=document.getElementById("pinInput").value.trim(), status=document.getElementById("loginStatus");

      status.textContent="Checking\u2026";

      const { data, error } = await db.from("students").select("id, display_name").ilike("display_name",name).eq("pin",pin);

      if(error){ status.textContent="Something went wrong: "+error.message; return; }

      if(!data||!data.length){ status.textContent="We couldn't find that name and PIN. Try again."; return; }

      currentStudent=data[0]; status.textContent="";

      await loadProgress(); renderPicker();

      document.getElementById("loginPanel").classList.add("hidden");

      toast("Welcome, "+currentStudent.display_name+"! Pick a unit.");

    }

    async function loadProgress(){ doneLessons=[]; const { data, error } = await db.from("progress").select("lesson_id").eq("student_id",currentStudent.id).eq("status","completed"); if(error){ console.error(error); return; } doneLessons=(data||[]).map(r=>String(r.lesson_id)); }

    function logout(){ currentStudent=null; doneLessons=[]; document.getElementById("nameInput").value=""; document.getElementById("pinInput").value=""; renderPicker(); document.getElementById("loginPanel").classList.add("hidden"); toast("Logged out"); }



    async function finishLessonAndReturn(){

      await markLessonComplete();

      if(LMN_PREVIEW){buildHub();showCard('hubScreen');}

      else {renderUnit();showCard('unitScreen');}

    }

    function toggleCal(){ document.body.classList.toggle("cal"); }

    function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},1600); }



    renderPicker();

    if(LMN_PREVIEW){

      fetch('preview-lesson.json').then(r=>{if(!r.ok)throw Error('Preview unavailable');return r.json();}).then(data=>{

        currentLesson=data.lesson;currentUnit=data.unit;previewCards=data.cards;

        document.getElementById('hubStage').style.backgroundImage='url("lesson-menu.png")';

        buildHub();showCard('hubScreen');

      }).catch(()=>toast('Could not open the lesson preview.'));

    }

  </script>
