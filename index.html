<!DOCTYPE html>
<!--
  ============================================================
  LMN TREE — FULL SHELL (Step 4: reads content from Supabase)
  ============================================================
  Units, lessons, and cards now come LIVE from your database.
  Tap a unit  -> loads its lessons from `lessons`
  Tap a tile  -> loads that lesson (art + video from `lessons`)
  Listen&Speak-> loads that lesson's cards from `cards`
  Finish      -> writes progress (lesson_id = the lesson's DB id)

  Positions (PICKER/GRID/HUB/CARD/UCTRL) are still hardcoded —
  that's your calibration, unchanged. Only content is now from DB.

  Add a lesson in Supabase -> it appears here. No code edits.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMN Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; } html,body { height:100%; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#1a2230; background:#000; }
  .screen { min-height:100vh; }
  .screen.center { display:flex; align-items:center; justify-content:center; padding:16px; background:#eef2f7; }
  .screen.artfull { display:flex; align-items:center; justify-content:center; background:#000; }
  .hidden { display:none !important; }
  .stage { position:relative; aspect-ratio:16/9; width:min(100vw, calc(100vh * 1.7778)); background-size:100% 100%; background-position:center; background-repeat:no-repeat; }
  .zone { position:absolute; border:none; background:transparent; cursor:pointer; padding:0; border-radius:12px; }
  .zone.circle { border-radius:50%; }
  .zone:hover { background:rgba(255,255,255,.16); }  
  .zone.nav { display:flex; align-items:center; justify-content:center; color:#fff; font-size:5vw; font-weight:800; line-height:1; background:rgba(20,24,31,.5); border-radius:50%; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .zone.nav:hover { background:rgba(20,24,31,.72); }
  .zone.locked { cursor:not-allowed; background:rgba(10,12,18,.55); }
  .zone.locked:hover { background:rgba(10,12,18,.55); }
  .zone.locked::after { content:"\1F512"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .zone.done::after { content:"\2713"; position:absolute; top:3%; right:5%; width:20px; height:20px; border-radius:50%; background:#17a06a; color:#fff; border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .ovl { position:absolute; }
  #loginPanel { position:absolute; top:13%; right:1.5%; width:min(300px,44%); background:#fff; border-radius:12px; box-shadow:0 14px 34px rgba(0,0,0,.35); padding:16px; z-index:15; text-align:center; }
  #loginPanel h3 { margin:0 0 4px; font-size:18px; } #loginPanel .hint { margin:0 0 12px; font-size:12px; color:#7c8aa0; }
  #loginPanel input { display:block; width:100%; margin:0 0 10px; padding:10px 12px; font:inherit; font-size:15px; border:1px solid #cfd7e3; border-radius:9px; }
  #loginPanel button.go { width:100%; border:none; border-radius:9px; padding:11px; font:inherit; font-size:15px; background:#2f6fed; color:#fff; cursor:pointer; }
  #loginPanel button.link { background:none; border:none; color:#2f6fed; cursor:pointer; font:inherit; font-size:13px; margin-top:8px; }
  #loginPanel .st { min-height:18px; margin-top:8px; font-size:13px; color:#c0392b; }
  #pointsBox { position:absolute; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; color:#2b3a52; pointer-events:none; font-size:2.4vw; }
  #hubVideo { position:absolute; background:#000; overflow:hidden; }
  #hubVideo video { width:100%; height:100%; object-fit:cover; }
  #phraseBox { font-family:"Andika",cursive; font-weight:700; color:#1a2230; font-size:5vw; line-height:1.05; display:flex; align-items:center; justify-content:center; text-align:center; }
    #phraseBox .wp { text-align:center; }
  #phraseBox .wtap { cursor:pointer; border-radius:6px; padding:0 .04em; transition:background .1s; }
  #phraseBox .wtap:hover { background:rgba(47,111,237,.16); } #phraseBox .wtap:active { background:rgba(47,111,237,.32); }
  #transPanel { background:rgba(255,255,255,.92); border:1px solid #dfe6f0; border-radius:10px; padding:.7vw .8vw; display:flex; flex-direction:column; gap:.4vw; overflow:auto; }
  #transPanel .en { color:#2f6fed; font-weight:700; font-size:.95vw; }
  #transPanel select { font:inherit; font-size:1vw; padding:.35vw; border:1px solid #cfd7e3; border-radius:7px; }
  #transPanel .out { font-weight:700; color:#2b3a52; min-height:1.2em; font-size:1.15vw; }
  #transPanel .listen { align-self:flex-start; border:none; background:#17a06a; color:#fff; border-radius:7px; padding:.35vw .7vw; font:inherit; font-size:.95vw; cursor:pointer; }
  #recBtn { position:absolute; border:none; background:transparent center/contain no-repeat; cursor:pointer; aspect-ratio:1/1; padding:0; transition:transform .08s ease, filter .08s ease; }
  #recBtn:hover { transform:scale(1.04); filter:brightness(1.06); }
  .cardnav { position:absolute; border:none; background:transparent center/contain no-repeat; cursor:pointer; aspect-ratio:1/1; padding:0; transition:transform .08s ease, filter .08s ease; }
  .cardnav:hover { transform:scale(1.05); filter:brightness(1.06); }
  #phoneMedia { background:#000; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#667; font-size:1vw; }
  #phoneMedia video, #phoneMedia img { width:100%; height:100%; object-fit:contain; }
  #playToggle { position:absolute; display:flex; align-items:center; justify-content:center; border:none; border-radius:50%; background:rgba(20,24,31,.72); color:#fff; cursor:pointer; padding:0; aspect-ratio:1/1; }
  #playToggle svg { width:56%; height:56%; fill:#fff; }
  #playToggle:hover { background:rgba(20,24,31,.9); }
  body.cal .zone { background:rgba(47,111,237,.30)!important; outline:2px dashed #fff; }
  body.cal .ovl { outline:2px dashed #e53935; }
  body.cal #pointsBox { outline:2px dashed #e53935; background:rgba(229,57,53,.25); }
  body.cal .zone::before { content:attr(data-n); position:absolute; top:2px; left:4px; color:#fff; font-size:12px; font-weight:800; text-shadow:0 1px 2px #000; }
  body.cal #recBtn { outline:2px dashed #fff; }
  body.cal .cardnav { outline:2px dashed #fff; }
  #calBtn { position:fixed; top:10px; left:10px; z-index:40; font:inherit; font-size:13px; cursor:pointer; background:#14181f; color:#fff; border:none; border-radius:8px; padding:8px 12px; opacity:.85; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#14181f; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40; }
  #toast.show { opacity:1; }
   /* ===== RECORDER OVERLAY — BOTTOM SHEET (active) ===== */
  #recOverlay { position:fixed; inset:0; z-index:60; background:rgba(10,12,18,.55); display:flex; align-items:flex-end; justify-content:center; }
  #recOverlay:not(.hidden) { animation:recFade .25s ease; }
  #recPanel { position:relative; width:100%; max-width:720px; height:min(85vh,640px); background:#fff; border-radius:18px 18px 0 0; box-shadow:0 -12px 44px rgba(0,0,0,.42); overflow:hidden; animation:recSlideUp .30s cubic-bezier(.22,.61,.36,1); }
  #recFrame { width:100%; height:100%; border:none; background:#fff; }
  #recClose { position:absolute; top:8px; right:10px; z-index:2; width:34px; height:34px; border:none; border-radius:50%; background:#14181f; color:#fff; font-size:18px; line-height:1; cursor:pointer; opacity:.9; }
  @keyframes recSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  @keyframes recFade { from { opacity:0; } to { opacity:1; } }

  /* ===== REVERT: CENTERED PANEL (to switch back, comment the block above and un-comment this) =====
  #recOverlay { position:fixed; inset:0; z-index:60; background:rgba(10,12,18,.72); display:flex; align-items:center; justify-content:center; padding:12px; }
  #recPanel { position:relative; width:min(720px,94vw); height:min(620px,92vh); background:#fff; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.5); overflow:hidden; }
  #recFrame { width:100%; height:100%; border:none; background:#fff; }
  #recClose { position:absolute; top:8px; right:10px; z-index:2; width:34px; height:34px; border:none; border-radius:50%; background:#14181f; color:#fff; font-size:18px; line-height:1; cursor:pointer; opacity:.9; }
  */</style>
</head>
<body>

  <div class="screen artfull hidden" id="slidesScreen"><div class="stage" id="slidesStage"></div></div>

      <button id="recClose" onclick="closeRecorder()" aria-label="Close">&times;</button>

    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://quymqrdoxmplpiwrptbb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mGAO-9c1PXZT9ltrVtHVLg_g4d_WgN4";

    const WHEEL_IMG   = "https://res.cloudinary.com/dvokel99y/image/upload/v1786859227/YAAAAAAAAAAAYYYYYYYYYYYYYYYYYY_bskthl.png";
    const CUE_CARD_BG = "https://res.cloudinary.com/dvokel99y/image/upload/v1786867154/BEST_study_card_background_august_cxiok6.png";
    const FUNCTION_URL = "https://us-central1-eco-groove-475802-i4.cloudfunctions.net/lmn-translate";
    const RECORDER_URL = "https://adamkwiseman.github.io/lmn-recorder/lmn_recorder_final.html";
    const BADGE_IMG    = "https://res.cloudinary.com/dvokel99y/image/upload/v1786871243/transparent_speak_and_listen_dfd0f6.png";
    const MAIN_BTN = "https://res.cloudinary.com/dvokel99y/image/upload/v1788534939/70b7e6c4-acf0-4b45-9e58-ca2810d7beb9_nhplc4.png";
    const UNIT_BTN = "https://res.cloudinary.com/dvokel99y/image/upload/v1788534940/unit_1_button_xvwke3.png";
    const L1_BTN   = "https://res.cloudinary.com/dvokel99y/image/upload/v1788534940/l1_button_d0meju.png";

    let db=null;
    try { const { createClient } = supabase; db = createClient(SUPABASE_URL, SUPABASE_KEY); }
    catch(e){ console.error("Supabase init:", e); }

    function showCard(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden")); document.getElementById(id).classList.remove("hidden"); }
    function pxs(o){ return 'left:'+o.left+'%; top:'+o.top+'%; width:'+o.width+'%; height:'+o.height+'%;'; }

    /* session / live data */
    let currentStudent=null, doneLessons=[];
    let currentUnit=null, lessonsByNumber={}, currentLesson=null, currentCards=[];
    let currentLang=""; try{ currentLang=localStorage.getItem("lmnLang")||""; }catch(e){ currentLang=""; }
    document.getElementById("pickerStage").style.backgroundImage='url("'+WHEEL_IMG+'")';
    document.getElementById("slidesStage").style.backgroundImage='url("'+CUE_CARD_BG+'")';

    /* ===== WHEEL PICKER (calibrated) ===== */
    const PW=1672, PH=941;
    const PICKER = { cxf:0.514, cyf:0.676, rpx:151, zsz:89, rotDeg:0 };
    const PICKER_CTRL = { loginBtn:{left:78.0,top:4.5,width:19.0,height:9.0}, pickunit:{left:41.0,top:90.0,width:24.0,height:8.0} };
    function renderPicker(){
      let html="";
      for(let k=1;k<=10;k++){
        const th=(PICKER.rotDeg+(k-0.5)*36)*Math.PI/180;
        const px=PICKER.cxf*PW+PICKER.rpx*Math.sin(th), py=PICKER.cyf*PH-PICKER.rpx*Math.cos(th);
        const l=(px-PICKER.zsz/2)/PW*100, t=(py-PICKER.zsz/2)/PH*100, w=PICKER.zsz/PW*100, h=PICKER.zsz/PH*100;
        html+='<button class="zone circle" data-n="'+k+'" style="left:'+l+'%; top:'+t+'%; width:'+w+'%; height:'+h+'%;" onclick="pickUnit('+k+')"></button>';
      }
      html+=ctrl(PICKER_CTRL.loginBtn,"LOGIN","toggleLoginPanel()");
      html+=ctrl(PICKER_CTRL.pickunit,"PICK","pickHint()");
      const st=document.getElementById("pickerStage"), panel=document.getElementById("loginPanel");
      st.innerHTML=html; st.appendChild(panel);
    }
    function ctrl(c,label,handler){ return '<button class="zone" data-n="'+label+'" style="'+pxs(c)+'" onclick="'+handler+'"></button>'; }

    async function pickUnit(k){
      if(!currentStudent){ toast("Please log in first"); openLoginPanel(); return; }
      const { data, error } = await db.from("units").select("*").eq("unit_number",k).limit(1);
      if(error){ console.error("units load:",error); toast("Couldn't load unit (see console)"); return; }
      if(!data || !data.length){ toast("Unit "+k+" \u2014 coming soon"); return; }
      currentUnit=data[0];
      if(currentUnit.art_url) document.getElementById("unitStage").style.backgroundImage='url("'+currentUnit.art_url+'")';
      await loadLessons(currentUnit.id);
      renderUnit();
      showCard("unitScreen");
    }
    function pickHint(){ if(!currentStudent){ toast("Log in, then tap a number"); openLoginPanel(); } else toast("Tap a number to choose a unit"); }
    function toggleLoginPanel(){ const p=document.getElementById("loginPanel"); if(p.classList.contains("hidden")) openLoginPanel(); else p.classList.add("hidden"); }
    function openLoginPanel(){ const p=document.getElementById("loginPanel"); document.getElementById("loginForm").classList.toggle("hidden",!!currentStudent); document.getElementById("loginInfo").classList.toggle("hidden",!currentStudent); if(currentStudent) document.getElementById("whoName").textContent=currentStudent.display_name; p.classList.remove("hidden"); }

    async function loadLessons(unitId){
      lessonsByNumber={};
      const { data, error } = await db.from("lessons").select("*").eq("unit_id",unitId).order("lesson_number");
      if(error){ console.error("lessons load:",error); return; }
      (data||[]).forEach(function(l){ lessonsByNumber[l.lesson_number]=l; });
    }

    /* ===== UNIT TILES (calibrated) ===== */
    const GRID={cols:5,rows:3,startX:16.9,startY:21.6,tileW:13.9,tileH:18.1,gapX:1.0,gapY:3.4};
    const UCTRL={home:{left:5.5,top:84.5,width:10.0,height:13.5},points:{left:30.0,top:85.0,width:40.0,height:12.5},store:{left:84.0,top:84.0,width:8.0,height:14.5}};
    const DEMO_POINTS=0;
    function stateFor(i){
      const num=i+1, lesson=lessonsByNumber[num];
      if(!lesson) return "locked";
      const id=String(lesson.id);
      if(doneLessons.includes(id)) return "done";
      if(num===1) return "available";
      const prev=lessonsByNumber[num-1];
      if(prev && doneLessons.includes(String(prev.id))) return "available";
      return "locked";
    }
    function renderUnit(){
      let html="";
      for(let i=0;i<15;i++){
        const st=stateFor(i),col=i%GRID.cols,row=Math.floor(i/GRID.cols);
        const l=GRID.startX+col*(GRID.tileW+GRID.gapX), t=GRID.startY+row*(GRID.tileH+GRID.gapY);
        html+='<button class="zone '+st+'" data-n="'+(i+1)+'" style="left:'+l+'%; top:'+t+'%; width:'+GRID.tileW+'%; height:'+GRID.tileH+'%;" onclick="openLesson('+i+')"></button>';
      }
      html+=ctrl(UCTRL.home,"HOME","showCard('pickerScreen')");
      html+=ctrl(UCTRL.store,"STORE","toast('LMN Tree Knowledge Store \u2014 coming later')");
      const p=UCTRL.points;
      html+='<div id="pointsBox" data-n="POINTS" style="'+pxs(p)+'">\u2B50 '+DEMO_POINTS+'</div>';
      document.getElementById("unitStage").innerHTML=html;
    }
    function openLesson(i){
      const num=i+1, lesson=lessonsByNumber[num];
      if(!lesson){ toast("Lesson "+num+" \u2014 coming soon"); return; }
      if(stateFor(i)==="locked"){ return; }
      currentLesson=lesson;
      if(lesson.art_url) document.getElementById("hubStage").style.backgroundImage='url("'+lesson.art_url+'")';
      buildHub();
      showCard("hubScreen");
    }

    /* ===== LESSON HUB (calibrated positions) ===== */
    const HUB={ video:{left:1.8,top:2.8,width:50.5,height:56,n:"VIDEO"}, listen:{left:57.5,top:28,width:41,height:17,n:"LISTEN & SPEAK"}, games:{left:57.5,top:47,width:41,height:17,n:"PRACTICE GAMES"}, read:{left:57.5,top:66,width:41,height:17,n:"READ & WRITE"}, home:{left:1.5,top:85,width:7,height:13,n:"HOME"} };
    function buildHub(){
      let h="";
      h+='<button class="zone" data-n="'+HUB.video.n+'" style="'+pxs(HUB.video)+'" onclick="playHubVideo()"></button>';
      h+='<button class="zone" data-n="'+HUB.listen.n+'" style="'+pxs(HUB.listen)+'" onclick="openSlides()"></button>';
      h+='<button class="zone" data-n="'+HUB.games.n+'" style="'+pxs(HUB.games)+'" onclick="toast(\'Practice Games \u2014 coming later\')"></button>';
      h+='<button class="zone" data-n="'+HUB.read.n+'" style="'+pxs(HUB.read)+'" onclick="toast(\'Read & Write \u2014 coming later\')"></button>';
      h+='<button class="zone" data-n="'+HUB.home.n+'" style="'+pxs(HUB.home)+'" onclick="showCard(\'unitScreen\')"></button>';
      document.getElementById("hubStage").innerHTML=h;
    }
    function playHubVideo(){
      const url = currentLesson && currentLesson.video_url;
      if(!url){ toast("No video set for this lesson yet"); return; }
      let v=document.getElementById("hubVideo");
      if(!v){ v=document.createElement("div"); v.id="hubVideo"; v.setAttribute("style",pxs(HUB.video)); v.innerHTML='<video src="'+url+'" controls autoplay playsinline></video>'; document.getElementById("hubStage").appendChild(v); }
    }

    /* ===== CUE CARDS (calibrated positions) ===== */
    const CARD={ phrase:{left:23.5,top:29,width:34,height:12}, trans:{left:20,top:45.5,width:40,height:20}, phone:{left:71,top:23,width:18.5,height:56}, prev:{left:1,top:43,width:8,height:14,n:"PREV"}, next:{left:91,top:43,width:8,height:14,n:"NEXT"}, sayit:{left:35.5,top:76.5,width:10,height:9,n:"LISTEN & SAY IT"}, rec:{left:36.5,top:70,width:8,n:"RECORD"},  back:{left:0.5,top:0.5,width:12,height:8,n:"BACK"}, playbtn:{left:75.75,top:79,width:9,height:9,n:"PLAY"} };
    const CARDNAV = {
      main:  {left:71.0, top:3.0, width:5.5, img:MAIN_BTN, go:"showCard('pickerScreen')", n:"MAIN"},
      unit:  {left:77.5, top:3.0, width:5.5, img:UNIT_BTN, go:"showCard('unitScreen')", n:"UNIT"},
      lesson:{left:84.0, top:3.0, width:5.5, img:L1_BTN,   go:"showCard('hubScreen')", n:"LESSON"}
    };
    const LANGS='<option value="" selected>\uD83C\uDF10 Translate\u2026</option><optgroup label="Priority"><option value="am">Amharic</option><option value="ti">Tigrinya</option><option value="so">Somali</option><option value="ar">Arabic</option><option value="bn">Bengali</option><option value="ms">Malay</option><option value="th">Thai</option></optgroup><optgroup label="All languages"><option value="ab">Abkhaz</option><option value="ace">Acehnese</option><option value="ach">Acholi</option><option value="af">Afrikaans</option><option value="sq">Albanian</option><option value="alz">Alur</option><option value="am">Amharic</option><option value="ar">Arabic</option><option value="hy">Armenian</option><option value="as">Assamese</option><option value="awa">Awadhi</option><option value="ay">Aymara</option><option value="az">Azerbaijani</option><option value="ban">Balinese</option><option value="bm">Bambara</option><option value="ba">Bashkir</option><option value="eu">Basque</option><option value="btx">Batak Karo</option><option value="bts">Batak Simalungun</option><option value="bbc">Batak Toba</option><option value="be">Belarusian</option><option value="bem">Bemba</option><option value="bn">Bengali</option><option value="bew">Betawi</option><option value="bho">Bhojpuri</option><option value="bik">Bikol</option><option value="bs">Bosnian</option><option value="br">Breton</option><option value="bg">Bulgarian</option><option value="bua">Buryat</option><option value="yue">Cantonese</option><option value="ca">Catalan</option><option value="ceb">Cebuano</option><option value="ny">Chichewa (Nyanja)</option><option value="zh-CN">Chinese (Simplified)</option><option value="zh-TW">Chinese (Traditional)</option><option value="cv">Chuvash</option><option value="co">Corsican</option><option value="crh">Crimean Tatar</option><option value="hr">Croatian</option><option value="cs">Czech</option><option value="da">Danish</option><option value="din">Dinka</option><option value="dv">Divehi atin</option><option value="lv">Latvian</option><option value="lij">Ligurian</option><option value="li">Limburgan</option><option value="ln">Lingala</option><option value="lt">Lithuanian</option><option value="lmo">Lombard</option><option value="luo">Luo</option><option value="lb">Luxembourgish</option><option value="mk">Macedonian</option><option value="mai">Maithili</option><option value="mak">Makassar</option><option value="mg">Malagasy</option><option value="ms">Malay</option><option value="ms-Arab">Malay (Jawi)</option><option value="ml">Malayalam</option><option value="mt">Maltese</option><option value="mi">Maori</option><option value="mr">Marathi</option><option value="chm">Meadow Mari</option><option value="mni-Mtei">Meiteilon (Manipuri)</option><option value="min">Minang</option><option value="lus">Mizo</option><option value="mn">Mongolian</option><option value="my">Myanmar (Burmese)</option><option value="nr">Ndebele (South)</option><option value="new">Nepalbhasa (Newari)</option><option value="ne">Nepali</option><option value="nso">Northern Sotho (Sepedi)</option><option value="no">Norwegian</option><option value="nus">Nuer</option><option value="oc">Occitan</option><option value="or">Odia (Oriya)</option><option value="om">Oromo</option><option value="pag">Pangasinan</option><option value="pap">Papiamento</option><option value="ps">Pashto</option><option value="fa">Persian</option><option value="pl">Polish</option><option value="pt">Portuguese</option><option value="pt-BR">Portuguese (Brazil)</option><option value="pt-PT">Portuguese (Portugal)</option><option value="pa">Punjabi</option><option value="pa-Arab">Punjabi (Shahmukhi)</option><option value="qu">Quechua</option><option value="rom">Romani</option><option value="ro">Romanian</option><option value="rn">Rundi</option><option value="ru">Russian</option><option value="sm">Samoan</option><option value="sg">Sango</option><option value="sa">Sanskrit</option><option value="gd">Scots Gaelic</option><option value="sr">Serbian</option><option value="st">Sesotho</option><option value="crs">Seychellois Creole</option><option value="shn">Shan</option><option value="sn">Shona</option><option value="scn">Sicilian</option><option value="szl">Silesian</option><option value="sd">Sindhi</option><option value="si">Sinhala (Sinhalese)</option><option value="sk">Slovak</option><option value="sl">Slovenian</option><option value="so">Somali</option><option value="es">Spanish</option><option value="su">Sundanese</option><option value="sw">Swahili</option><option value="ss">Swati</option><option value="sv">Swedish</option><option value="tg">Tajik</option><option value="ta">Tamil</option><option value="tt">Tatar</option><option value="te">Telugu</option><option value="tet">Tetum</option><option value="th">Thai</option><option value="ti">Tigrinya</option><option value="ts">Tsonga</option><option value="tn">Tswana</option><option value="tr">Turkish</option><option value="tk">Turkmen</option><option value="ak">Twi (Akan)</option><option value="uk">Ukrainian</option><option value="ur">Urdu</option><option value="ug">Uyghur</option><option value="uz">Uzbek</option><option value="vi">Vietnamese</option><option value="cy">Welsh</option><option value="xh">Xhosa</option><option value="yi">Yiddish</option><option value="yo">Yoruba</option><option value="yua">Yucatec Maya</option><option value="zu">Zulu</option></optgroup>';
    let sIdx=0, curAudio=null;
    async function openSlides(){
      const { data, error } = await db.from("cards").select("*").eq("lesson_id",currentLesson.id).order("card_order");
      if(error){ console.error("cards load:",error); toast("Couldn't load cards (see console)"); return; }
      if(!data || !data.length){ toast("No cards yet for this lesson"); return; }
      currentCards=data; sIdx=0; buildSlides(); showCard("slidesScreen");
    }
    function curS(){ return currentCards[sIdx]; }
    function buildSlides(){
      let h="";
      h+='<div class="ovl" id="phraseBox" style="'+pxs(CARD.phrase)+'"></div>';
      h+='<div class="ovl" id="transPanel" style="'+pxs(CARD.trans)+'"><div class="en" id="enPhrase"></div><select id="langSel" onchange="doTranslate()">'+LANGS+'</select><div class="out" id="transOut"></div><button class="listen" id="listenBtn" style="display:none" onclick="doListen()">\uD83D\uDD0A Listen</button></div>';
      h+='<div class="ovl" id="phoneMedia" style="'+pxs(CARD.phone)+'"></div>';
      h+='<button class="zone nav" data-n="'+CARD.prev.n+'" style="'+pxs(CARD.prev)+'" onclick="prevSlide()">‹</button>';
      h+='<button class="zone nav" data-n="'+CARD.next.n+'" style="'+pxs(CARD.next)+'" onclick="nextSlide()">›</button>';
      h+='<button class="zone" data-n="'+CARD.sayit.n+'" style="'+pxs(CARD.sayit)+'" onclick="record()"></button>';
      h+='<button id="recBtn" data-n="'+CARD.rec.n+'" style="left:'+CARD.rec.left+'%; top:'+CARD.rec.top+'%; width:'+CARD.rec.width+'%; background-image:url('+BADGE_IMG+');" onclick="record()"></button>';
      h+='<button class="zone" data-n="'+CARD.back.n+'" style="'+pxs(CARD.back)+'" onclick="showCard(\'hubScreen\')"></button>';
      Object.keys(CARDNAV).forEach(function(k){ const b=CARDNAV[k]; h+='<button class="cardnav" data-n="'+b.n+'" style="left:'+b.left+'%; top:'+b.top+'%; width:'+b.width+'%; background-image:url('+b.img+');" onclick="'+b.go+'"></button>'; });
      document.getElementById("slidesStage").innerHTML=h; showSlide();
    }
    function showSlide(){
      const s=curS();
      renderClickablePhrase(document.getElementById("phraseBox"), s.phrase);
      document.getElementById("enPhrase").textContent="EN: "+s.phrase;
      const tp=document.getElementById("transPanel");
      if(s.skip_translate){
        tp.style.display="none";
      } else {
        tp.style.display="";
        document.getElementById("langSel").value=currentLang; document.getElementById("transOut").textContent=""; document.getElementById("listenBtn").style.display="none";
        if(currentLang) doTranslate();
      }
      const media=s.phone_media_url, pm=document.getElementById("phoneMedia");
      const mt=(s.phone_media_type||"").toLowerCase().trim();
      const isVideo = !!media && ( mt.indexOf("video")>-1 || ( mt!=="image" && mt!=="img" && /\.(mp4|m4v|mov|webm|ogv)(\?|#|$)/i.test(media) ) );
      pm.innerHTML = media ? (isVideo ? '<video id="cardVideo" src="'+media+'" playsinline webkit-playsinline preload="metadata"></video>' : '<img src="'+media+'" alt="">') : "media";
      const oldBtn=document.getElementById("playToggle"); if(oldBtn) oldBtn.remove();
      if(isVideo){
        const b=document.createElement("button");
        b.id="playToggle"; b.setAttribute("style",pxs(CARD.playbtn));
        b.innerHTML=PLAY_ICON;
        b.onclick=togglePlay;
        document.getElementById("slidesStage").appendChild(b);
        const v=document.getElementById("cardVideo");
        v.onplay=function(){ b.innerHTML=PAUSE_ICON; };
        v.onpause=function(){ b.innerHTML=PLAY_ICON; };
        v.onended=function(){ b.innerHTML=PLAY_ICON; };
      }
    }
    function prevSlide(){ if(sIdx>0){ sIdx--; } else { sIdx=currentCards.length-1; } showSlide(); }
    function nextSlide(){
      if(sIdx<currentCards.length-1){ sIdx++; showSlide(); }
      else { markLessonComplete(); sIdx=0; showSlide(); }
    }
    async function markLessonComplete(){
      if(!currentLesson) return;
      const lid=String(currentLesson.id);
      if(doneLessons.includes(lid)) return;
      doneLessons.push(lid);            // optimistic: also blocks a double-insert if they loop fast
      renderUnit();                     // refresh the (hidden) grid so the next lesson is unlocked on return
      if(!db || !currentStudent) return;
      const { error } = await db.from("progress").insert({ student_id:currentStudent.id, lesson_id:lid, status:"completed" });
      if(error){ console.error(error); return; }
      toast("Lesson complete! \u2713");
    }
      async function doTranslate(){
      const lang=document.getElementById("langSel").value, out=document.getElementById("transOut"), lb=document.getElementById("listenBtn");
      currentLang=lang; try{ localStorage.setItem("lmnLang",lang); }catch(e){}
      if(!lang){ out.textContent=""; lb.style.display="none"; return; }
      const forIdx=sIdx;
      out.textContent="Translating\u2026"; lb.style.display="none";
      try{ const r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"translate",text:curS().phrase,lang:lang})}); const d=await r.json(); if(forIdx!==sIdx) return; if(d.translation){ out.textContent=d.translation; lb.style.display="inline-block"; } else out.textContent="No translation."; }catch(e){ if(forIdx===sIdx) out.textContent="Translation unavailable."; }
    }
    async function doListen(){
      const lang=document.getElementById("langSel").value, text=document.getElementById("transOut").textContent;
      if(!lang||!text) return;
      if(curAudio&&!curAudio.paused){ curAudio.pause(); curAudio.currentTime=0; return; }
      try{ const r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"speak",text:text,lang:lang})}); const d=await r.json(); if(d.audio){ curAudio=new Audio("data:audio/mp3;base64,"+d.audio); curAudio.play(); } }catch(e){}
    }
    function speakWord(w){
      try{ if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=0.9; window.speechSynthesis.speak(u); }catch(e){}
    }
    function renderClickablePhrase(el, phrase){
      el.innerHTML="";
      const wrap=document.createElement("span"); wrap.className="wp";
      String(phrase).split(/(\s+)/).forEach(function(tok){
        if(tok==="") return;
        if(/^\s+$/.test(tok)){ wrap.appendChild(document.createTextNode(tok)); return; }
        const clean=tok.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,"");
        const sp=document.createElement("span"); sp.className="wtap"; sp.textContent=tok;
        sp.onclick=function(){ speakWord(clean||tok); };
        wrap.appendChild(sp);
      });
      el.appendChild(wrap);
    }
      const PLAY_ICON='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      const PAUSE_ICON='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
     function togglePlay(){ const v=document.getElementById("cardVideo"); if(!v) return; if(v.paused) v.play(); else v.pause(); }
      function record(){ openRecorder(curS().recorder_slide); }
      function openRecorder(slide){
      const ov=document.getElementById("recOverlay"), fr=document.getElementById("recFrame");
      fr.src = RECORDER_URL + "?slide=" + encodeURIComponent(slide);
      ov.classList.remove("hidden");
    }
    function closeRecorder(){
      const ov=document.getElementById("recOverlay"), fr=document.getElementById("recFrame");
      ov.classList.add("hidden");
      fr.src = "about:blank";   // unloads the recorder → releases the microphone
    }
    window.addEventListener("message", function(e){
      if(e && e.data && (e.data==="lmnRecorderDone" || (e.data && e.data.type==="lmnRecorderDone"))) closeRecorder();
    });

    /* ===== LOGIN + PROGRESS ===== */
    async function doLogin(){
      if(!db){ document.getElementById("loginStatus").textContent="Supabase not configured."; return; }
      const name=document.getElementById("nameInput").value.trim(), pin=document.getElementById("pinInput").value.trim(), status=document.getElementById("loginStatus");
      status.textContent="Checking\u2026";
      const { data, error } = await db.from("students").select("id, display_name").ilike("display_name",name).eq("pin",pin);
      if(error){ status.textContent="Something went wrong: "+error.message; return; }
      if(!data||!data.length){ status.textContent="We couldn't find that name and PIN. Try again."; return; }
      currentStudent=data[0]; status.textContent="";
      await loadProgress(); renderPicker();
      document.getElementById("loginPanel").classList.add("hidden");
      toast("Welcome, "+currentStudent.display_name+"! Pick a unit.");
    }
    async function loadProgress(){ doneLessons=[]; const { data, error } = await db.from("progress").select("lesson_id").eq("student_id",currentStudent.id).eq("status","completed"); if(error){ console.error(error); return; } doneLessons=(data||[]).map(r=>String(r.lesson_id)); }
    function logout(){ currentStudent=null; doneLessons=[]; document.getElementById("nameInput").value=""; document.getElementById("pinInput").value=""; renderPicker(); document.getElementById("loginPanel").classList.add("hidden"); toast("Logged out"); }

    async function finishLessonAndReturn(){
      const lid=String(currentLesson.id);
      if(doneLessons.includes(lid)){ renderUnit(); showCard("unitScreen"); return; }
      if(!db || !currentStudent){ renderUnit(); showCard("unitScreen"); return; }
      const { error } = await db.from("progress").insert({ student_id:currentStudent.id, lesson_id:lid, status:"completed" });
      if(error){ console.error(error); toast("Couldn't save progress"); showCard("unitScreen"); return; }
      doneLessons.push(lid); renderUnit(); showCard("unitScreen"); toast("Lesson complete! \u2713");
    }

    function toggleCal(){ document.body.classList.toggle("cal"); }
    function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},1600); }

    renderPicker();
  </script>
